<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Metadados - Template</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        /* Font Face Declarations for Lexend */
        @font-face {
            font-family: 'Lexend';
            src: url('IdentidadeGraficaSGGOV2025/Tipo de letra/Lexend-Thin.ttf') format('truetype');
            font-weight: 100;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Lexend';
            src: url('IdentidadeGraficaSGGOV2025/Tipo de letra/Lexend-ExtraLight.ttf') format('truetype');
            font-weight: 200;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Lexend';
            src: url('IdentidadeGraficaSGGOV2025/Tipo de letra/Lexend-Light.ttf') format('truetype');
            font-weight: 300;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Lexend';
            src: url('IdentidadeGraficaSGGOV2025/Tipo de letra/Lexend-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Lexend';
            src: url('IdentidadeGraficaSGGOV2025/Tipo de letra/Lexend-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Lexend';
            src: url('IdentidadeGraficaSGGOV2025/Tipo de letra/Lexend-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Lexend';
            src: url('IdentidadeGraficaSGGOV2025/Tipo de letra/Lexend-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Lexend';
            src: url('IdentidadeGraficaSGGOV2025/Tipo de letra/Lexend-ExtraBold.ttf') format('truetype');
            font-weight: 800;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Lexend';
            src: url('IdentidadeGraficaSGGOV2025/Tipo de letra/Lexend-Black.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
        }

        :root {
            --primary-color: #5B9C86; /* Verde-azulado principal */
            --primary-dark: #4A7C6B; /* Versão mais escura */
            --primary-light: #7BB8A3; /* Versão mais clara */
            --primary-lighter: #9DCCB8; /* Versão muito clara */
            --primary-lightest: #E8F5F0; /* Versão mais clara para fundos */
            --secondary-color: #4A7C6B; /* Verde-azulado escuro */
            --accent-color: #E8F5F0; /* Verde-azulado muito claro */
            --success-color: #5B9C86; /* Verde-azulado */
            --info-color: #E8F5F0; /* Verde-azulado claro */
            --warning-color: #D4A574; /* Dourado suave */
            --danger-color: #B87C7C; /* Rosa-vermelho suave */
            --light-color: #f8f9fa;
            --dark-color: #2C4A3E; /* Verde-azulado muito escuro */
            --border-radius: 0.75rem;
            --box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            --box-shadow-lg: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Lexend', sans-serif;
            background: linear-gradient(135deg, var(--primary-lightest) 0%, #ffffff 50%, var(--primary-lightest) 100%);
            min-height: 100vh;
            color: var(--dark-color);
        }

        .main-container {
            padding: 2rem 0;
        }

        .header-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--box-shadow-lg);
            border: 2px solid var(--primary-color);
        }

        .header-title {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 0.5rem;
            font-family: 'Lexend', sans-serif;
        }

        .header-subtitle {
            color: var(--secondary-color);
            font-weight: 400;
            font-family: 'Lexend', sans-serif;
        }

        .metadata-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--box-shadow);
            border: 1px solid var(--accent-color);
            transition: all 0.3s ease;
        }

        .metadata-section:hover {
            transform: translateY(-2px);
            box-shadow: var(--box-shadow-lg);
            border-color: var(--primary-light);
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--primary-color);
        }

        .section-icon {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            font-size: 1.2rem;
        }

        .section-title {
            color: var(--primary-color);
            font-weight: 600;
            margin: 0;
            font-size: 1.25rem;
            font-family: 'Lexend', sans-serif;
        }

        .form-label {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            font-family: 'Lexend', sans-serif;
        }

        .form-label i {
            margin-right: 0.5rem;
            color: var(--primary-color);
        }

        .form-control, .form-select {
            border-radius: 0.5rem;
            border: 2px solid var(--accent-color);
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: 'Lexend', sans-serif;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(91, 156, 134, 0.15);
        }

        .form-control::placeholder {
            color: #6B7C93;
            opacity: 0.7;
            font-family: 'Lexend', sans-serif;
        }

        .btn-export {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: var(--border-radius);
            padding: 1rem 2rem;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: var(--box-shadow);
            font-family: 'Lexend', sans-serif;
        }

        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: var(--box-shadow-lg);
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
        }

        .floating-action-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            font-size: 1.5rem;
            box-shadow: var(--box-shadow-lg);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .floating-action-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.2);
        }

        .progress-indicator {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 1001;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 1rem 0;
            }
            
            .header-section {
                padding: 1.5rem;
                margin-bottom: 1.5rem;
            }
            
            .metadata-section {
                padding: 1rem;
                margin-bottom: 1rem;
            }
            
            .section-header {
                flex-direction: column;
                text-align: center;
            }
            
            .section-icon {
                margin-right: 0;
                margin-bottom: 0.5rem;
            }
            
            .floating-action-btn {
                bottom: 1rem;
                right: 1rem;
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
        }

        @media print {
            body {
                background: white;
            }
            
            .header-section, .metadata-section {
                background: white;
                box-shadow: none;
                border: 1px solid #dee2e6;
            }
            
            .floating-action-btn, .progress-indicator {
                display: none;
            }
        }
    </style>
</head>
<body>

<!-- Progress Indicator -->
<div class="progress-indicator">
    <div class="progress-bar" id="progressBar"></div>
</div>

<div class="container-fluid main-container">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-8">
            
            <!-- Header Section -->
            <div class="header-section text-center">
                <h1 class="header-title">
                    <i class="bi bi-file-earmark-text me-2"></i>
                    Ficha de Metadados
                </h1>
                <p class="header-subtitle fs-5">
                    Template para Estruturas Governamentais
                </p>
            </div>

            <!-- Business Metadata -->
            <div class="metadata-section">
                <div class="section-header">
                    <div class="section-icon">
                        <i class="bi bi-building"></i>
                    </div>
                    <h3 class="section-title">Business Metadata (Contextual)</h3>
                </div>
                
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-briefcase"></i>
                            Nome da Entidade
                        </label>
                        <input type="text" class="form-control" placeholder="Ex.: Ministério da Administração Interna">
                    </div>
                    
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-target"></i>
                            Missão / Função
                        </label>
                        <textarea class="form-control" rows="3" placeholder="Descreve a missão institucional e função principal."></textarea>
                    </div>
                    
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-gear"></i>
                            Regras de Negócio
                        </label>
                        <textarea class="form-control" rows="2" placeholder="Ex.: Considera-se ativa se publicada no DR e listada no Portal do Governo."></textarea>
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label">
                            <i class="bi bi-file-earmark-text"></i>
                            Fonte Legal / Decreto
                        </label>
                        <input type="text" class="form-control" placeholder="Ex.: Decreto-Lei n.º 45/2019">
                    </div>
                </div>
            </div>

            <!-- Technical Metadata -->
            <div class="metadata-section">
                <div class="section-header">
                    <div class="section-icon">
                        <i class="bi bi-code-slash"></i>
                    </div>
                    <h3 class="section-title">Technical Metadata (Estrutura Técnica)</h3>
                </div>
                
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-table"></i>
                            Nome da Tabela
                        </label>
                        <input type="text" class="form-control" placeholder="Ex.: entidades">
                    </div>
                    
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-list-ul"></i>
                            Campos Principais
                        </label>
                        <textarea class="form-control" rows="2" placeholder="Ex.: id_entidade (INT), nome (VARCHAR 255), tipo (VARCHAR 100)"></textarea>
                    </div>
                    
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-diagram-3"></i>
                            Relacionamentos
                        </label>
                        <textarea class="form-control" rows="2" placeholder="Ex.: 1 Ministério → N Entidades; 1 Entidade → N Subentidades"></textarea>
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label">
                            <i class="bi bi-arrow-repeat"></i>
                            Origem Técnica (Base/Workflow)
                        </label>
                        <input type="text" class="form-control" placeholder="Ex.: Base SQL → Lakehouse Microsoft Fabric → Dashboard Power BI">
                    </div>
                </div>
            </div>

            <!-- Operational Metadata -->
            <div class="metadata-section">
                <div class="section-header">
                    <div class="section-icon">
                        <i class="bi bi-clock"></i>
                    </div>
                    <h3 class="section-title">Operational Metadata (Operações)</h3>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="bi bi-calendar-check"></i>
                            Última Atualização
                        </label>
                        <input type="date" class="form-control">
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="bi bi-calendar-event"></i>
                            Frequência de Atualização
                        </label>
                        <select class="form-select">
                            <option value="">Selecionar frequência</option>
                            <option value="diaria">Diária</option>
                            <option value="semanal">Semanal</option>
                            <option value="mensal">Mensal</option>
                            <option value="legislatura">Por Legislatura</option>
                        </select>
                    </div>
                    
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-arrow-left-right"></i>
                            Pipeline / Workflow
                        </label>
                        <textarea class="form-control" rows="2" placeholder="Ex.: API Diário da República → ETL → Power BI"></textarea>
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label">
                            <i class="bi bi-journal-text"></i>
                            Logs / Auditoria
                        </label>
                        <textarea class="form-control" rows="2" placeholder="Ex.: Última execução bem-sucedida, erros registados, aprovações"></textarea>
                    </div>
                </div>
            </div>

            <!-- Descriptive Metadata -->
            <div class="metadata-section">
                <div class="section-header">
                    <div class="section-icon">
                        <i class="bi bi-tags"></i>
                    </div>
                    <h3 class="section-title">Descriptive Metadata (Identificação)</h3>
                </div>
                
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-award"></i>
                            Título Oficial
                        </label>
                        <input type="text" class="form-control" placeholder="Ex.: Autoridade Nacional de Emergência e Proteção Civil">
                    </div>
                    
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-hash"></i>
                            Palavras-chave
                        </label>
                        <input type="text" class="form-control" placeholder="Ex.: Proteção Civil, Segurança, Emergência">
                    </div>
                    
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-text-paragraph"></i>
                            Resumo Curto
                        </label>
                        <textarea class="form-control" rows="3" placeholder="Breve descrição para facilitar a pesquisa e identificação."></textarea>
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label">
                            <i class="bi bi-fingerprint"></i>
                            Identificador Único
                        </label>
                        <input type="text" class="form-control" placeholder="Ex.: ANEPC_XXV_2025">
                    </div>
                </div>
            </div>

            <!-- Structural Metadata -->
            <div class="metadata-section">
                <div class="section-header">
                    <div class="section-icon">
                        <i class="bi bi-diagram-2"></i>
                    </div>
                    <h3 class="section-title">Structural Metadata (Organização)</h3>
                </div>
                
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-building-fill"></i>
                            Ministério Pai
                        </label>
                        <input type="text" class="form-control" placeholder="Ex.: Ministério da Administração Interna">
                    </div>
                    
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-tree"></i>
                            Hierarquia
                        </label>
                        <textarea class="form-control" rows="2" placeholder="Ex.: Ministério → Secretaria de Estado → Entidade Dependente"></textarea>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="bi bi-diagram-project"></i>
                            Função no Organograma
                        </label>
                        <input type="text" class="form-control" placeholder="Ex.: Órgão central com delegações regionais">
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="bi bi-layers"></i>
                            Nível Administrativo
                        </label>
                        <select class="form-select">
                            <option value="">Selecionar nível</option>
                            <option value="direta">Administração Direta</option>
                            <option value="indireta">Administração Indireta</option>
                            <option value="autonoma">Administração Autónoma</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Administrative Metadata -->
            <div class="metadata-section">
                <div class="section-header">
                    <div class="section-icon">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <h3 class="section-title">Administrative Metadata (Gestão e Preservação)</h3>
                </div>
                
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-c-circle"></i>
                            Direitos e Licenciamento
                        </label>
                        <input type="text" class="form-control" placeholder="Ex.: Informação pública sob regime de transparência administrativa">
                    </div>
                    
                    <div class="col-12 mb-3">
                        <label class="form-label">
                            <i class="bi bi-file-earmark-text"></i>
                            Documentos Legais Associados
                        </label>
                        <textarea class="form-control" rows="2" placeholder="Ex.: Decreto-Lei n.º 45/2019, Despacho de Nomeação de 2025"></textarea>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="bi bi-person-check"></i>
                            Responsável pela Manutenção
                        </label>
                        <input type="text" class="form-control" placeholder="Ex.: Secretaria-Geral do MAI">
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="bi bi-calendar-plus"></i>
                            Data de Criação / Última Revisão
                        </label>
                        <input type="date" class="form-control">
                    </div>
                </div>
            </div>

            <!-- Export Button -->
            <div class="text-center mt-4 mb-5">
                <button class="btn btn-export btn-lg" onclick="exportToPDF()">
                    <i class="bi bi-file-earmark-pdf me-2"></i>
                    Exportar para PDF
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Floating Action Button -->
<button class="floating-action-btn" onclick="scrollToTop()" id="scrollTopBtn" style="display: none;">
    <i class="bi bi-arrow-up"></i>
</button>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Progress bar functionality
    function updateProgressBar() {
        const scrollTop = window.pageYOffset;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const scrollPercent = (scrollTop / docHeight) * 100;
        document.getElementById('progressBar').style.width = scrollPercent + '%';
    }

    // Scroll to top button
    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    // Show/hide scroll to top button
    function toggleScrollButton() {
        const scrollBtn = document.getElementById('scrollTopBtn');
        if (window.pageYOffset > 300) {
            scrollBtn.style.display = 'block';
        } else {
            scrollBtn.style.display = 'none';
        }
    }

    // Export to PDF function
    function exportToPDF() {
        // Add loading state
        const btn = event.target;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Gerando PDF...';
        btn.disabled = true;
        
        // Simulate PDF generation
        setTimeout(() => {
            window.print();
            btn.innerHTML = originalText;
            btn.disabled = false;
        }, 1000);
    }

    // Event listeners
    window.addEventListener('scroll', () => {
        updateProgressBar();
        toggleScrollButton();
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        updateProgressBar();
        toggleScrollButton();
    });
</script>

</body>
</html>
